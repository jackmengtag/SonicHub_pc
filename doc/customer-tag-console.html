<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SonicHub · 客户标签治理台（演示原型）</title>
<style>
:root{
  --bg:#090e0f; --side:#0a0f10; --panel:#0f1617; --panel2:#121b1c; --panel3:#162122;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.13);
  --text:#eef3f2; --text2:#c2ccc9; --text3:#8b9895; --text4:#5f6d6a;
  --accent:#ff7a45; --mint:#3ddc97; --gold:#f6c945; --danger:#ff6b6b; --blue:#6ea8fe;
  --mono:'SFMono-Regular','JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 520px at 10% -10%,rgba(255,122,69,.08),transparent 60%),radial-gradient(900px 460px at 92% 0%,rgba(61,220,151,.045),transparent 55%),var(--bg);color:var(--text);font:13px/1.6 'Avenir Next','PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.shell{display:flex;height:100vh;overflow:hidden}

/* ---------- sidebar ---------- */
.side{width:236px;flex:none;display:flex;flex-direction:column;background:rgba(10,15,16,.96);border-right:1px solid var(--line)}
.brand{height:68px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--line)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff7a45,#ffb36b);color:#14100d;font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,122,69,.25)}
.brand b{display:block;font-size:13.5px;letter-spacing:.02em}
.brand small{display:block;color:var(--text4);font-size:10px;letter-spacing:.09em}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav-label{padding:12px 12px 6px;color:#4f5c59;font-size:10px;letter-spacing:.14em}
.nav-item{position:relative;width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 0;border:0;border-radius:8px;background:none;color:#a7b3b0;text-align:left;font-size:12.5px}
.nav-item:hover{background:rgba(255,255,255,.035);color:#fff}
.nav-item.active{background:rgba(255,122,69,.1);color:var(--accent)}
.nav-item.active:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.nav-ico{width:16px;text-align:center;opacity:.9}
.nav-count{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--text3);font-size:10px;display:grid;place-items:center}
.nav-item.active .nav-count{background:rgba(255,122,69,.18);color:var(--accent)}
.side-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ffd08e,#c98a55);color:#241a11;display:grid;place-items:center;font-weight:800;font-size:11px}
.side-foot b{display:block;font-size:12px}
.side-foot small{display:block;color:var(--text4);font-size:10px}

/* ---------- topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(9,14,15,.72);backdrop-filter:blur(8px)}
.crumb{color:var(--text4);font-size:12px}
.crumb b{color:var(--text);font-weight:600;margin-left:8px}
.top-right{display:flex;align-items:center;gap:10px}
.subject-switch{display:flex;padding:3px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}
.subject-switch button{border:0;background:none;color:var(--text3);padding:5px 10px;border-radius:6px;font-size:11.5px}
.subject-switch button.on{background:rgba(255,122,69,.14);color:var(--accent)}
.demo-pill{border:1px solid rgba(246,201,69,.28);background:rgba(246,201,69,.08);color:var(--gold);font-size:10px;padding:3px 8px;border-radius:20px;letter-spacing:.05em}
.env{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:11px}
.env i{width:6px;height:6px;border-radius:50%;background:var(--text4)}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text3);width:32px;height:32px;border-radius:8px;line-height:1}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}

/* ---------- content ---------- */
.content{flex:1;overflow:auto;padding:24px 26px 56px}
.wrap{max-width:1380px;margin:0 auto}
.view{animation:rise .24s ease}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}
.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.page-head h1{margin:5px 0 5px;font-size:25px;letter-spacing:-.02em;font-weight:700}
.page-head p{margin:0;color:var(--text3);font-size:12px;max-width:760px}
.actions{display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--text2);border-radius:8px;padding:8px 13px;font-size:12px;transition:.16s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b0e07;font-weight:700}
.btn.primary:hover{background:#ff9163;color:#1b0e07}
.btn.ghost{background:none}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:6px}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.35)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--accent);color:#1b0e07}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.018);margin-bottom:18px;overflow:hidden}
.stats.five{grid-template-columns:repeat(5,1fr)}
.stat{padding:15px 18px;border-right:1px solid var(--line);position:relative}
.stat:last-child{border-right:0}
.stat span{display:block;color:var(--text4);font-size:10.5px;letter-spacing:.04em}
.stat b{display:block;font-size:23px;letter-spacing:-.03em;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.stat small{color:var(--text3);font-size:10.5px}
.stat em{font-style:normal;color:var(--mint)}
.stat em.warn{color:var(--gold)}
.stat em.bad{color:var(--danger)}

.panel{border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.018)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em}
.panel-head .sub{color:var(--text4);font-size:11px}
.panel-body{padding:16px}
.mt{margin-top:18px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:16px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line)}
.input,.select{height:33px;border:1px solid var(--line2);background:rgba(0,0,0,.22);border-radius:7px;padding:0 10px;color:var(--text);outline:none;font-size:12px}
.input:focus,.select:focus{border-color:rgba(255,122,69,.55);box-shadow:0 0 0 2px rgba(255,122,69,.1)}
.select{color:var(--text2)}
.search{position:relative}
.search .input{width:248px;padding-left:29px}
.search span{position:absolute;left:10px;top:7px;color:var(--text4);font-size:12px}
.grow{flex:1}
.muted{color:var(--text4);font-size:11px}
.mono{font-family:var(--mono);font-size:11px}
.hint{color:var(--text4);font-size:10.5px;margin-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text3);border-radius:20px;padding:4px 11px;font-size:11px}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(255,122,69,.08)}

/* table */
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--text4);font-size:10.5px;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.012)}
td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--text2);font-size:11.5px;vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.022)}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11px}
.t-main{display:flex;flex-direction:column;gap:2px}
.t-main b{color:var(--text);font-size:12px;font-weight:600}
.t-main span{font-family:var(--mono);font-size:10px;color:var(--text4)}
.right{text-align:right}
.center{text-align:center}
.row-hover{cursor:pointer}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:10px;line-height:1.7;white-space:nowrap;border:1px solid transparent}
.b-fact{color:#9dc0ff;background:rgba(110,168,254,.1);border-color:rgba(110,168,254,.2)}
.b-metric{color:#b9c6c3;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.b-rule{color:var(--mint);background:rgba(61,220,151,.09);border-color:rgba(61,220,151,.2)}
.b-model{color:var(--gold);background:rgba(246,201,69,.08);border-color:rgba(246,201,69,.2)}
.b-manual{color:var(--accent);background:rgba(255,122,69,.1);border-color:rgba(255,122,69,.22)}
.b-active{color:var(--mint);background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.18)}
.b-active:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint)}
.b-draft{color:var(--text3);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}
.b-pending{color:var(--accent);background:rgba(255,122,69,.09);border-color:rgba(255,122,69,.2)}
.b-deprecated{color:var(--gold);background:rgba(246,201,69,.07);border-color:rgba(246,201,69,.18)}
.b-archived{color:var(--text4);background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07)}
.b-expired{color:var(--danger);background:rgba(255,107,107,.07);border-color:rgba(255,107,107,.2)}
.b-failed{color:var(--danger);background:rgba(255,107,107,.09);border-color:rgba(255,107,107,.22)}
.b-running{color:var(--accent);background:rgba(255,122,69,.1);border-color:rgba(255,122,69,.24)}
.b-running:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.b-succeeded{color:var(--mint);background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.18)}
.b-succeeded:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint)}
.b-queued{color:var(--text3);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}
.b-sens{color:var(--danger);background:rgba(255,107,107,.07);border-color:rgba(255,107,107,.2)}
.b-safe{color:var(--mint);background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.2)}
.b-high{color:var(--danger);background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.22)}
.b-mid{color:var(--gold);background:rgba(246,201,69,.08);border-color:rgba(246,201,69,.2)}
.b-low{color:var(--text3);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}
.b-allow{color:var(--mint);background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.18)}
.b-block{color:var(--danger);background:rgba(255,107,107,.07);border-color:rgba(255,107,107,.2)}
.b-lock{color:var(--text3);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}
.orange{color:var(--gold)}

/* scenario board */
.scen{display:grid;grid-template-columns:1fr 1fr}
.scen-row{display:grid;grid-template-columns:26px minmax(120px,1.4fr) minmax(110px,1.2fr) 82px 74px;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
.scen-row:nth-child(odd){border-right:1px solid rgba(255,255,255,.05)}
.scen-row:nth-last-child(-n+2){border-bottom:0}
.scen-row .idx{width:22px;height:22px;border-radius:6px;background:rgba(255,122,69,.1);color:var(--accent);font-size:10px;display:grid;place-items:center;font-weight:700}
.scen-row b{font-size:11.5px;font-weight:600;display:block}
.scen-row small{color:var(--text4);font-size:10px;display:block}
.scen-row .seg-code{font-family:var(--mono);font-size:10px;color:var(--text3)}
.scen-row .cnt{font-family:var(--mono);font-size:11px;text-align:right}
.scen-row .link{border:0;background:none;color:var(--accent);font-size:10.5px;text-align:right}

/* alerts */
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:9px;border:1px solid rgba(246,201,69,.18);background:rgba(246,201,69,.05);color:#e7d9ad;font-size:11.5px;margin-bottom:9px}
.alert:last-child{margin-bottom:0}
.alert.orange{border-color:rgba(255,122,69,.2);background:rgba(255,122,69,.055);color:#ffcfb9}
.alert.ok{border-color:rgba(61,220,151,.16);background:rgba(61,220,151,.05);color:#bfe9d5}
.alert.bad{border-color:rgba(255,107,107,.2);background:rgba(255,107,107,.05);color:#ffc9c9}
.alert b{font-weight:600}
.alert .grow{flex:1;min-width:0}
.alert.hintline{background:rgba(255,255,255,.02);border-color:var(--line);color:var(--text3)}

/* bar */
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s ease}
.bar.mint i{background:var(--mint)}
.bar.gold i{background:var(--gold)}
.bar.danger i{background:var(--danger)}
.bar.sm{width:74px;display:inline-block;vertical-align:middle;margin-right:7px}
.bar.lg{height:8px}

/* drawer/modal */
.mask{position:fixed;inset:0;background:rgba(3,7,8,.72);backdrop-filter:blur(2px);z-index:40;display:none}
.mask.open{display:block}
.drawer{position:absolute;right:0;top:0;height:100%;width:min(640px,100%);background:#0d1415;border-left:1px solid var(--line2);box-shadow:-20px 0 60px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:slide .24s ease}
@keyframes slide{from{transform:translateX(36px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer-head h2{margin:3px 0 4px;font-size:17px}
.drawer-head .code{font-family:var(--mono);font-size:10.5px;color:var(--text3)}
.drawer-body{flex:1;overflow:auto;padding:18px 20px 40px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--text4);padding:8px 11px;font-size:11.5px;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px 12px;font-size:11.5px;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.kv span{color:var(--text4)}
.kv b{font-weight:500;color:var(--text2)}
.section-t{font-size:11px;color:var(--text4);letter-spacing:.06em;margin:18px 0 8px}
.codebox{background:#070c0d;border:1px solid var(--line);border-radius:8px;padding:13px;font-family:var(--mono);font-size:10.5px;line-height:1.85;color:#b9d3cb;white-space:pre-wrap;overflow:auto}
.codebox .kw{color:#ff9e6b}.codebox .str{color:#8bd7a8}.codebox .cm{color:#5d6f6b}
.timeline{position:relative;padding-left:16px}
.timeline:before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.09)}
.tl-item{position:relative;padding:0 0 15px 0}
.tl-item:before{content:"";position:absolute;left:-16px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--panel3);border:1.5px solid var(--text4)}
.tl-item.on:before{background:var(--accent);border-color:var(--accent)}
.tl-item b{font-size:11.5px;display:block}
.tl-item small{color:var(--text4);font-size:10px}

.modal-root{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(3,7,8,.72);backdrop-filter:blur(2px)}
.modal-root.open{display:grid}
.modal{width:min(480px,calc(100% - 28px));background:#0e1516;border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .18s ease;max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.modal.wide{width:min(680px,calc(100% - 28px))}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{margin:0;font-size:15px}
.modal-head p{margin:4px 0 0;color:var(--text4);font-size:11px}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex:none}
.form-row{margin-bottom:13px}
.form-row label{display:flex;justify-content:space-between;align-items:center;color:var(--text3);font-size:11px;margin-bottom:6px}
.form-row .input,.form-row .select{width:100%}
.form-row textarea{width:100%;min-height:74px;resize:vertical;background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:7px;padding:9px 10px;color:var(--text);outline:none;font-size:12px}
.form-row textarea:focus{border-color:rgba(255,122,69,.55)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.check{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:11px;color:var(--text2);background:rgba(255,255,255,.015)}
.check input{margin:2px 0 0}
.err-line{color:var(--danger);font-size:11px;margin-top:6px;min-height:16px}

/* customer 360 */
.c360{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.hero{display:flex;align-items:center;gap:13px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hero .avatar{width:44px;height:44px;font-size:15px;flex:none}
.hero h2{margin:0 0 2px;font-size:17px}
.hero p{margin:0;color:var(--text4);font-size:11px;font-family:var(--mono)}
.hero .badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tgroup{border-bottom:1px solid rgba(255,255,255,.055);padding:13px 18px}
.tgroup:last-child{border-bottom:0}
.tgroup h3{margin:0 0 9px;font-size:10.5px;color:var(--text4);font-weight:500;letter-spacing:.07em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.025);font-size:11px}
.tag i{width:5px;height:5px;border-radius:50%;background:var(--text4);font-style:normal}
.tag.rule i{background:var(--mint)}.tag.model i{background:var(--gold)}.tag.manual i{background:var(--accent)}.tag.fact i{background:var(--blue)}
.tag small{color:var(--text3);font-size:10px}
.tag.sens{border-color:rgba(255,107,107,.22);background:rgba(255,107,107,.045)}
.tag.exp{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.06)}
.tag button{border:0;background:none;color:var(--accent);font-size:9.5px;padding:0 2px}
.tag button.lock{color:var(--text4)}
.rail .panel{margin-bottom:14px}
.evt{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:11px}
.evt:last-child{border-bottom:0}
.evt time{color:var(--text4);font-family:var(--mono);font-size:10px;min-width:74px;flex:none}
.evt b{font-weight:500;display:block;color:var(--text2)}
.evt small{color:var(--text4);font-size:10px}

/* segment builder */

.cond.bad{border-color:rgba(255,107,107,.32);background:rgba(255,107,107,.05)}
.cond .k{font-family:var(--mono);font-size:10.5px;color:var(--text3);min-width:170px}
.cond .op{color:var(--accent);font-family:var(--mono);font-size:11px}
.cond .v{color:var(--text);font-size:11.5px}
.cond .why{width:100%;color:var(--danger);font-size:10px}
.cond .rm{margin-left:auto;border:0;background:none;color:var(--text4);font-size:14px;padding:0 3px}
.cond .rm:hover{color:var(--danger)}
.logic{display:flex;align-items:center;gap:8px;margin:5px 0 10px;color:var(--text4);font-size:10.5px;flex-wrap:wrap}
.logic button{border:1px solid var(--line);background:none;color:var(--text3);border-radius:5px;padding:2px 8px;font-size:10px}
.logic button.on{border-color:var(--accent);color:var(--accent);background:rgba(255,122,69,.08)}
.estimate{padding:16px}
.estimate .big{font-size:31px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.estimate .cap{color:var(--text4);font-size:10.5px;letter-spacing:.06em}
.snap{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:11px}
.snap:last-child{border-bottom:0}
.snap .mono{color:var(--text3);font-size:10px}
.snap .grow{flex:1;min-width:0}

/* empty */
.empty{padding:38px 16px;text-align:center;color:var(--text4)}
.empty b{display:block;color:var(--text2);font-size:12px;margin-bottom:4px}
.empty p{margin:0;font-size:11px}

/* switch */
.switch{position:relative;width:42px;height:23px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.1);transition:.18s;flex:none}
.switch b{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#cfd8d6;transition:.18s}
.switch.on{background:rgba(61,220,151,.35);border-color:rgba(61,220,151,.5)}
.switch.on b{left:21px;background:var(--mint)}

/* purpose cards */
.purposes{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.purpose{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:rgba(255,255,255,.018);text-align:left;transition:.16s}
.purpose:hover{border-color:var(--line2)}
.purpose.on{border-color:rgba(255,122,69,.5);background:rgba(255,122,69,.06)}
.purpose b{display:block;font-size:12px;margin-bottom:2px}
.purpose small{display:block;color:var(--text4);font-size:10px;line-height:1.6}
.purpose .pf{display:flex;justify-content:space-between;align-items:center;margin-top:9px}

/* toast */
#toast{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#14201f;border:1px solid rgba(61,220,151,.35);color:#d7f5e6;border-radius:8px;padding:10px 14px;font-size:11.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .2s ease;max-width:360px}
.toast.err{border-color:rgba(255,107,107,.4);color:#ffd9d9;background:#201415}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .scen{grid-template-columns:1fr}

  .stat:nth-child(2){border-right:0}

/* =========================================================
   Mock API（本地异步，不连接后端）
   ========================================================= */
const api = {
  delay(ms){ return new Promise(r => setTimeout(r, ms == null ? 420 : ms)); },
  async createTag(payload){ await this.delay(380); return {...payload, status:'draft', version:'v1', hits:0, coverage:'0%', lastUpdated:'—'}; },
  async dryRun(code){ await this.delay(300); const t = tagByCode(code); const seed = code.length * 137; return { hits: Math.round((t.hits || 12000) * 1.016), coverage: t.coverage === '0%' ? '39.8%' : (parseFloat(t.coverage) + 1.3).toFixed(1) + '%', nullRate:'1.2%', samples: sampleFor(t) }; },
  async estimate(){ await this.delay(520); return computeEstimate(); },
  async mutation(){ await this.delay(300); return true; }
};

function sampleFor(t){
  const rows = Object.keys(customers).filter(k => customers[k].subject === t.subject && !customers[k].removed).slice(0,3);
  return rows.map(k => `${customers[k].id.padEnd(8)} ${customers[k].name.padEnd(4)} → ${t.values.split(' / ')[0]}`);
}

function computeEstimate(){
  const base = { user:498200, tenant:780, member:6400 }[state.subject] || 10000;
  const n = state.seg.conds.length;
  const factor = Math.pow(0.62, n) * (state.seg.logic === 'OR' ? 1.9 : 1);
  const cap = Math.round(base * 0.98 / 10) * 10;
  return Math.max(12, Math.min(cap, Math.round(base * factor / 10) * 10));
}

/* 标签可用性：正式圈选 / 投影统一判定 */
function tagIssue(t, opt){
  const scope = opt || {};
  if(!t) return '标签不存在';
  if(isExpired(t)) return `有效期至 ${t.validUntil}，已过期，不得正式使用`;
  if(t.status !== 'active') return `标签状态为「${STATUS[t.status]}」，不可正式使用`;
  if(t.subject === 'member' && !(scope.tenant || state.seg.tenant)) return '成员标签必须指定 tenant_id';
  if(t.domain === 'listening'){
    const src = srcById(t.source);
    if(!src || src.status !== 'registered') return '听歌域数据源尚未完成登记审批';
  }
  if(isStale(t.code)) return '最近计算任务失败，标签结果已过期';
  return '';
}

function projectionIssue(t, p){
  if(!p) return '用途不存在';
  if(isExpired(t)) return `有效期至 ${t.validUntil}，已过期`;
  if(t.status !== 'active') return `标签${STATUS[t.status]}，不可投影`;
  if(t.domain === 'listening'){
    const src = srcById(t.source);
    if(!src || src.status !== 'registered') return '听歌域数据源未登记，不可投影';
  }
  if(p.id === 'music_rank' && MUSIC_RANK_FORBIDDEN.includes(t.domain)) return '付费 / 风险 / 健康属性禁止参与音乐排序';
  if(!p.subjects.includes(t.subject)) return `用途不支持「${SUBJECTS[t.subject]}」主体`;
  if(!p.domains.includes(t.domain)) return `${DOMAINS[t.domain]}域不在该用途白名单`;
  if(p.id === 'risk_control' && t.domain !== 'risk') return '风控用途仅允许 risk 域';
  if(!state.personalization && PERSONAL_TAGS.includes(t.code)) return '用户已关闭个性化，个人兴趣与序列不可投影';
  if(isStale(t.code)) return '最近计算失败，结果已过期';
  return '';
}

function exprOf(seg){
  return `${seg.logic}(${seg.conds.map(c=>`${c.code} ${c.op} ${c.value}`).join(', ') || '∅'})`;
}
function segProblems(){
  return state.seg.conds.map(c=>({cond:c, issue:tagIssue(tagByCode(c.code), {tenant:state.seg.tenant})}));
}

function renderAudit(){
  const actions = Array.from(new Set(audits.map(a=>a.action)));
  const q = state.audit.q.toLowerCase();
  const list = audits.filter(a=>
    (state.audit.action==='all'||a.action===state.audit.action) &&
    (!q || (a.actor+a.target+a.tag+a.purpose).toLowerCase().includes(q))
  );
  return `
  <div class="page-head">
    <div>
      <div class="eyebrow">ACCESS AUDIT</div>
      <h1>访问审计</h1>
      <p>敏感标签读取、导出、口径变更与个性化开关 100% 留痕。审计只追加，不修改不删除；记录最小化，不保存完整敏感个人值。</p>
    </div>
    <div class="actions"><button class="btn" data-act="audit-export">导出审计日志</button></div>
  </div>
  <div class="panel">
    <div class="toolbar">
      <div class="search"><span>⌕</span><input class="input" id="auditQ" placeholder="搜索操作人、对象或标签" value="${esc(state.audit.q)}" data-input="audit-q"/></div>
      <select class="select" data-input="audit-action">
        <option value="all">全部动作</option>
        ${actions.map(a=>`<option value="${a}" ${state.audit.action===a?'selected':''}>${a}</option>`).join('')}
      </select>
      <span class="grow"></span>
      <span class="muted">共 ${list.length} 条 · 最近 7 日敏感访问 128 次</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>操作人</th><th>动作</th><th>对象</th><th>标签</th><th>条数</th><th>用途</th><th>时间</th><th></th></tr></thead>
        <tbody>${list.length?list.map(a=>`
          <tr>
            <td>${a.actor}</td>
            <td><span class="badge ${a.action.includes('敏感')||a.action.includes('导出')||a.action.includes('删除')?'b-pending':'b-metric'}">${a.action}</span></td>
            <td class="mono" style="font-size:10.5px">${a.target}</td>
            <td class="mono" style="font-size:10.5px;color:var(--text3)">${a.tag}</td>
            <td class="num">${typeof a.rows==='number'?fmt(a.rows):a.rows}</td>
            <td style="color:var(--text3)">${a.purpose}</td>
            <td class="mono">${a.time}</td>
            <td class="right"><button class="btn sm" data-act="audit-detail" data-id="${a.id}">详情</button></td>
          </tr>`).join(''):`<tr><td colspan="8"><div class="empty"><b>没有匹配记录</b><p>调整关键词或动作筛选。</p></div></td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

function render(){
  renderNav();
  const map = {
    overview:renderOverview, catalog:renderCatalog, sources:renderSources,
    profile:renderProfile, segments:renderSegments, jobs:renderJobs,
    usage:renderUsage, approvals:renderApprovals, privacy:renderPrivacy, audit:renderAudit
  };
  $('#app').innerHTML = `<div class="view">${(map[state.view]||renderOverview)()}</div>`;
  if(state.focus){
    const el = document.getElementById(state.focus);
    if(el){ el.focus(); if(el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); }
  }
}

/* =========================================================

   ========================================================= */
function toast(msg, err){
  const el = document.createElement('div');
  el.className = 'toast' + (err?' err':'');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}
function openDrawer(html, name){
  state.drawer = name || '';
  $('#drawer').innerHTML = html;
  $('#mask').classList.add('open');
}
function closeDrawer(){ state.drawer=''; $('#mask').classList.remove('open'); }
function openModal(html, wide){
  $('#modalRoot').innerHTML = `<div class="modal ${wide?'wide':''}">${html}</div>`;
  $('#modalRoot').classList.add('open');
}
function closeModal(){ $('#modalRoot').classList.remove('open'); $('#modalRoot').innerHTML=''; }

function approvalImpact(a){
  switch(a.refType){
    case 'tag_publish': return '标签状态由草稿变为生效中，版本号保留，写入发布审计。';
    case 'tag_change': return '生成新版本并生效，旧版本归档；运行中任务继续使用旧版本。';
    case 'export': return '生成带水印导出文件，记录操作人、用途、条数与 IP，文件保留 30 天。';
    case 'manual_import': return '人工标签批量写入，必须带有效期；到期自动失效。';
    case 'source_register': return '数据源转为已登记，依赖标签仍各自受状态与有效期约束。';

function openDeletion(id){
  const d = deletionRequests.find(x=>x.id===id); if(!d) return;
  const pct = d.status==='completed'?100:d.status==='running'?(d.progress||0):0;
  openDrawer(`
    <div class="drawer-head"><div><div class="eyebrow">ERASURE REQUEST</div><h2>${d.subjectName} · ${d.subjectId}</h2><div class="code">${d.id}</div></div><button class="icon-btn" data-act="close-drawer">×</button></div>
    <div class="drawer-body">
      <div style="display:flex;gap:6px;margin-bottom:14px"><span class="badge ${d.status==='completed'?'b-active':d.status==='running'?'b-running':'b-pending'}">${{pending:'待审批',approved:'已批准',running:'执行中',completed:'已完成'}[d.status]||d.status}</span></div>
      <div class="kv"><span>清理范围</span><b>${d.scope.join('、')}</b></div>
      <div class="kv"><span>提交时间</span><b>${d.submitted}</b></div>
      <div class="kv"><span>完成时间</span><b>${d.completed||'—'}</b></div>

      ${d.result?`
        <div class="section-t">删除回执</div>

      <b style="color:var(--text2)">5. 过期与失败</b><br/>过期标签、计算失败标签不可正式使用；快照冻结条件与版本，不替代发送时退订检查。<br/>
      <b style="color:var(--text2)">6. 删除与审计</b><br/>删除覆盖派生数据；审计只追加、最小化，不保留完整敏感个人值。<br/>
      <div class="alert hintline" style="margin-top:14px;margin-bottom:0"><span>ⓘ</span><div class="grow">演示环境：所有数据、任务、审批和导出均为本地模拟，不连接真实后端，也不代表生产安全控制已落地。</div></div>
    </div>
    <div class="modal-foot"><button class="btn primary" data-act="close-modal">知道了</button></div>`, true);
}

/* =========================================================
   业务动作
   ========================================================= */
function logAudit(entry){
  audits.unshift(Object.assign({
    id:'au_' + (5600 + audits.length),
    actor:'林岚', ip:'10.24.6.12', time:nowLabel(), rows:'—', purpose:'—', meta:''
  }, entry));
}

function approveEffect(a){
  if(a.refType==='tag_publish' || a.refType==='tag_change'){
    const t = tagByCode(a.refCode);
    if(t){
      if(a.refType==='tag_change') t.version = bumpVersion(t.version);
      t.status = 'active';
      t.lastUpdated = nowLabel();
      logAudit({action:'发布标签', target:`${t.code} ${t.version}`, tag:t.code, purpose:a.id, meta:`审批单 ${a.id}；状态 ${STATUS[t.status]}`});
    }
  }else if(a.refType==='source_register'){
    const s = srcById(a.refCode);
    if(s){ s.status='registered'; s.lastCheck=nowLabel(); logAudit({action:'域登记通过', target:s.id, tag:'—', purpose:a.id, meta:`域 ${DOMAINS[s.domain]} 登记完成`}); }
  }else if(a.refType==='usage_grant'){
    const p = PURPOSES.find(x=>x.id===a.refCode);
    if(p && a.refDomain && !p.domains.includes(a.refDomain)) p.domains.push(a.refDomain);
    const az = authz.find(x=>x.purpose===a.refCode);
    if(az && a.refDomain && !az.scope.includes(DOMAINS[a.refDomain])) az.scope = az.scope + ' / ' + DOMAINS[a.refDomain];
    logAudit({action:'用途扩围审批', target:a.refCode, tag:'—', purpose:a.id, meta:`新增域：${a.refDomain?DOMAINS[a.refDomain]:'—'}；用途白名单已更新`});
  }else if(a.refType==='export'){
    logAudit({action:'导出人群包', target:a.target, tag:'多标签组合', rows:15000, purpose:'审批通过后导出', meta:`审批单 ${a.id}`});
  }else if(a.refType==='manual_import'){
    const t = tagByCode(a.refCode);
    if(t) t.lastUpdated = nowLabel();
    logAudit({action:'导入人工标签', target:a.target, tag:a.refCode, rows:312, purpose:'客服补偿', meta:`审批单 ${a.id}；有效期 2026-12-31`});
  }else if(a.refType==='deletion'){
    startDeletion(a.refId);
  }
  approvalHistory.unshift({id:a.id, type:a.type, target:a.target, result:'通过', actor:'数据合规-周明', time:nowLabel(), note:'审批通过，关联对象已更新'});
}

function rejectEffect(a, reason){
  if((a.refType==='tag_publish'||a.refType==='tag_change') && a.refCode){
    const t = tagByCode(a.refCode);
    if(t && t.status==='pending') t.status = 'draft';
  }
  approvalHistory.unshift({id:a.id, type:a.type, target:a.target, result:'驳回', actor:'数据合规-周明', time:nowLabel(), note:reason});
  logAudit({action:'审批驳回', target:a.target, tag:a.refCode||'—', purpose:a.id, meta:reason});
}

function startDeletion(id){
  const d = deletionRequests.find(x=>x.id===id);
  if(!d) return;
  d.status = 'running'; d.progress = 8; d.approvedBy = '数据合规-周明';
  render();
  const iv = setInterval(()=>{
    d.progress = Math.min(100, (d.progress||0) + 18);
    if(d.progress >= 100){
      clearInterval(iv);
      d.status = 'completed';
      d.completed = nowLabel();
      d.result = { tags:18, profile:6, snapshots:2, features:4 };
      const c = customers[d.subjectId];
      if(c){ c.removed = true; c.vals = {}; c.badges = [['b-archived','派生数据已删除']]; }
      logAudit({action:'删除派生数据', target:`${d.subjectName} · ${d.subjectId}`, tag:'—', rows:18, purpose:d.id, meta:'已清理标签结果 / 派生画像 / 快照引用 / 模型特征'});
      toast('删除完成，回执已写入审计');
    }
    if(state.view==='privacy') render();
    if(state.drawer==='deletion' && $('#mask').classList.contains('open')) openDeletion(id);
  }, 700);
}

/* =========================================================
   事件绑定
   ========================================================= */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]');
  if(!el){
    if(e.target.id==='mask') closeDrawer();
    if(e.target.classList.contains('modal-root')) closeModal();
    return;
  }
  const act = el.dataset.act, id = el.dataset.id;

  if(act==='nav'){
    state.view = id; state.focus = null;
    if(id==='segments') state.seg.scenario = state.seg.scenario || null;
    render(); return;
  }
  if(act==='subject'){
    if(state.subject===id){ render(); return; }
    state.subject = id;
    state.seg = { logic:'AND', conds:defaultConds(id), stale:false, estimate:null, estimating:false, tenant:'t_208', scenario:null };
    state.customer = firstCustomerOf(id);
    state.modalData = {};
    render(); toast(`已切换主体：${SUBJECTS[id]}，圈选条件已重置`); return;
  }
  if(act==='reset-demo'){ resetDemo(); return; }
  if(act==='help'){ modalHelp(); return; }
  if(act==='close-modal'){ closeModal(); return; }
  if(act==='close-drawer'){ closeDrawer(); return; }

  /* ---- 标签 ---- */
  if(act==='new-tag'){ modalNewTag(); return; }
  if(act==='open-tag'){ openTag(id); return; }
  if(act==='tag-tab'){ state.tagTab = id; openDrawer(drawerTag(), 'tag'); return; }

  if(act==='create-tag'){
    const name = ($('#ntName')||{}).value ? $('#ntName').value.trim() : '';
    const code = ($('#ntCode')||{}).value ? $('#ntCode').value.trim().toLowerCase() : '';
    const subject = $('#ntSubject').value;
    const layer = $('#ntLayer').value;
    const freq = $('#ntFreq').value;
    const valid = ($('#ntValid')||{}).value ? $('#ntValid').value.trim() : '';
    const source = $('#ntSource').value;
    const def = $('#ntDef').value.trim();
    const sens = $('#ntSens').checked;
    const auth = $('#ntAuth').checked;
    const purposes = Array.from(document.querySelectorAll('.ntPurpose:checked')).map(x=>x.value);
    const err = message => { const box = $('#ntErr'); if(box) box.textContent = message; toast(message, true); };

    if(name.length < 2) return err('请填写标签名称（至少 2 字）');
    if(!/^[a-z][a-z0-9_]*(\.[a-z0-9_]+){2}$/.test(code)) return err('编码格式应为 {主体}.{域}.{属性}，全小写点号分隔');
    if(!code.startsWith(subject + '.')) return err(`编码前缀必须与主体一致：${subject}.`);
    const domain = code.split('.')[1];
    if(!ALLOWED_DOMAINS.includes(domain) && domain !== 'listening') return err('域不在允许范围：profile / usage / creation / billing / lifecycle / service / risk / health');
    if(domain === 'listening') return err('听歌域需先在“来源与口径”完成登记审批，暂不能直接创建标签');
    if(def.length < 10) return err('业务口径至少 10 个字，需说明判定条件与边界');
    if(layer === 'manual' && !valid) return err('人工标签必须填写有效期');
    if(!purposes.length) return err('至少选择一个预期用途');
    if(sens && !purposes.length) return err('敏感标签必须限定用途');
    if(subject === 'member' && !state.seg.tenant) return err('成员标签必须绑定租户');

    const created = await api.createTag({ code, name, subject, layer, domain, values:'待定义', freq, status:'draft', owner:'林岚', sensitive:sens, source, definition:def, authoritative:auth, validUntil:valid, purposes });
    tags.unshift(created);
    closeModal();
    state.subject = subject;
    state.activeTag = code; state.tagTab='dryrun'; state.dryRun={status:'idle',progress:0};
    state.view = 'catalog';
    logAudit({action:'创建标签草稿', target:code, tag:code, purpose:purposes.join(', '), meta:`来源 ${source}；敏感 ${sens?'是':'否'}；权威事实 ${auth?'是':'否'}`});
    render(); openTag(code);
    toast('草稿已创建，请先试算再提交审批');
    return;
  }

  if(act==='dry-run'){
    const t = tagByCode(state.activeTag); if(!t) return;
    state.dryRun = { status:'running', progress:0 };
    openDrawer(drawerTag(), 'tag');
    const iv = setInterval(async ()=>{
      state.dryRun.progress = Math.min(96, state.dryRun.progress + 16);
      const bar = document.getElementById('dryBar');
      const pct = document.getElementById('dryPct');
      if(bar) bar.style.width = state.dryRun.progress + '%';
      if(pct) pct.textContent = state.dryRun.progress;
      if(state.dryRun.progress >= 96){
        clearInterval(iv);
        const result = await api.dryRun(t.code);
        t.dryResult = result;
        state.dryRun = { status:'done', progress:100 };
        if(state.drawer==='tag') openDrawer(drawerTag(), 'tag');
        toast('试算完成，可提交发布审批');
      }
    }, 220);
    return;
  }

  if(act==='publish'){
    const t = tagByCode(id); if(!t) return;
    if(!t.dryResult) return toast('请先完成试算', true);
    const ap = { id:'ap_' + (9100 + approvals.length), type:'新标签发布', refType:'tag_publish', refCode:t.code, target:`${t.code} ${t.version}`, applicant:'林岚', risk:t.sensitive?'高':'中', reason:'试算通过，提交发布审批', time:nowLabel() };
    approvals.unshift(ap);
    t.status = 'pending';
    closeDrawer(); render();
    toast('已提交发布审批，等待合规确认');
    return;
  }

  if(act==='new-version'){ modalNewVersion(id); return; }
  if(act==='create-version'){
    const reason = ($('#verReason')||{}).value ? $('#verReason').value.trim() : '';
    if(reason.length < 6){ const b=$('#verErr'); if(b) b.textContent='请填写至少 6 个字的变更说明'; return; }
    const t = tagByCode(id); if(!t) return;
    approvals.unshift({ id:'ap_'+(9100+approvals.length), type:'口径变更', refType:'tag_change', refCode:t.code, target:`${t.code} ${bumpVersion(t.version)}`, applicant:'林岚', risk:'中', reason, time:nowLabel() });
    closeModal(); closeDrawer(); render();
    toast('新版本草稿已提交审批');
    return;
  }

  if(act==='tag-recompute'){
    const t = tagByCode(id);
    jobs.unshift({ id:'job_'+Date.now().toString().slice(-6), tag:id, ver:t?t.version:'v1', mode:'full', window:'2026-11-19', status:'queued', progress:0, shards:'待调度', duration:'—', err:'' });
    closeDrawer(); state.view='jobs'; render();
    toast('已触发全量重算，任务进入队列');
    return;
  }

  /* ---- 来源 ---- */
  if(act==='source-detail'){ openSource(id); return; }
  if(act==='source-new'){ modalSource(); return; }
  if(act==='source-confirm'){
    const sid = ($('#srcId')||{}).value ? $('#srcId').value.trim() : '';
    const name = ($('#srcName')||{}).value ? $('#srcName').value.trim() : '';
    const table = ($('#srcTable')||{}).value ? $('#srcTable').value.trim() : '';
    const note = ($('#srcNote')||{}).value ? $('#srcNote').value.trim() : '';
    const subject = $('#srcSubject').value, domain = $('#srcDomain').value;
    if(!sid || !name || !table || note.length < 10){
      const b = $('#srcErr'); if(b) b.textContent = '请完整填写来源 ID、名称、表/事件与口径说明（至少 10 字）';
      return;
    }
    const dupe = sources.some(s=>s.id===sid);
    if(dupe){ const b= $('#srcErr'); if(b) b.textContent='来源 ID 已存在'; return; }
    sources.unshift({ id:sid, name, system:'待补充', table, subject, domain, fields:'待登记', quality:'—', status:'pending', owner:'林岚', latency:'待核验', license:'新域需完成合规评估', note, lastCheck:'—' });
    approvals.unshift({ id:'ap_'+(9100+approvals.length), type:'域登记', refType:'source_register', refCode:sid, target:`${sid} · ${domain} 域`, applicant:'林岚', risk:ALLOWED_DOMAINS.includes(domain)?'中':'高', reason:note, time:nowLabel() });
    closeModal(); state.view='sources'; render();
    toast('域登记已提交审批');
    return;
  }

  /* ---- 360 ---- */
  if(act==='reveal'){ modalReveal(id); return; }
  if(act==='confirm-reveal'){
    const reason = $('#revealReason').value;
    state.modalData['reveal_'+id] = true;
    logAudit({action:'查看敏感标签', target:`${customers[state.customer].name} / ${customers[state.customer].id}`, tag:id, rows:1, purpose:reason, meta:'单次授权 30 分钟；仅展示布尔/区间结果'});
    closeModal(); render();
    toast('已授权查看 30 分钟，本次访问已记录审计');
    return;
  }

  /* ---- 圈选 ---- */
  if(act==='open-seg'){
    const s = scenarios.find(x=>x.id===id); if(!s) return;
    if(s.subject !== state.subject){
      state.subject = s.subject;
      state.customer = firstCustomerOf(s.subject);
    }
    state.seg = { logic:'AND', conds:s.conds.map(c=>({...c})), stale:false, estimate:null, estimating:false, tenant:'t_208', scenario:s.name };
    state.view='segments';
    render();
    const blocked = s.conds.map(c=>tagIssue(tagByCode(c.code), {tenant:state.seg.tenant})).filter(Boolean);
    if(blocked.length) toast('已载入条件，但存在不可用标签：' + blocked[0], true);
    else toast('已载入场景条件，请重新估算');
    return;
  }
  if(act==='seg-add'){
    if(state.seg.conds.length >= 8) return toast('最多 8 个条件', true);
    modalAddCond(); return;
  }
  if(act==='seg-add-confirm'){
    const code = $('#segTag').value, op = $('#segOp').value, value = ($('#segVal').value || '').trim();
    if(!value){ const b=$('#segErr'); if(b) b.textContent='请填写条件值'; return; }
    const issue = tagIssue(tagByCode(code), {tenant:state.seg.tenant});
    if(issue){ const b=$('#segErr'); if(b) b.textContent='该标签不可用：'+issue; return; }
    state.seg.conds.push({code, op, value});
    state.seg.stale = true; state.seg.estimate = null; state.seg.scenario = null;
    closeModal(); render(); toast('条件已添加，请重新估算');
    return;
  }
  if(act==='seg-remove'){
    state.seg.conds.splice(Number(id),1);
    state.seg.stale = true; state.seg.estimate = null;
    render(); return;
  }
  if(act==='seg-logic'){ state.seg.logic = id; state.seg.stale = true; state.seg.estimate = null; render(); return; }
  if(act==='seg-estimate'){
    const problems = segProblems().filter(x=>x.issue);
    if(problems.length) return toast('存在不可用条件，无法估算', true);
    state.seg.estimating = true; render();
    const value = await api.estimate();
    state.seg.estimating = false; state.seg.estimate = value; state.seg.stale = false;
    render(); toast('估算完成，±3% 误差');
    return;
  }
  if(act==='seg-snapshot'){ modalSnapshot(); return; }
  if(act==='snap-confirm'){
    const name = ($('#snapName')||{}).value ? $('#snapName').value.trim() : '';
    if(!name){ const b=$('#snapErr'); if(b) b.textContent='请填写快照名称'; return; }
    const snap = {
      id:'snap_' + (1182 + state.snapshots.length), name, subject:state.subject,
      size:state.seg.estimate, time:nowLabel(),
      expire:(()=>{ const d=new Date(); d.setDate(d.getDate()+7); return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })(),
      expr:exprOf(state.seg), conds:state.seg.conds.map(c=>({...c})),
      tagVersions:state.seg.conds.reduce((m,c)=>{ const t=tagByCode(c.code); m[c.code]=t?t.version:'—'; return m; },{})
    };
    state.snapshots.unshift(snap);
    state.seg.scenario = name;
    closeModal(); render();
    toast(`快照已生成：${fmt(snap.size)} 人，触达请引用 ${snap.id}`);
    return;
  }
  if(act==='snap-detail'){ openSnapshot(id); return; }
  if(act==='snap-export'){ closeDrawer(); modalExport(id); return; }
  if(act==='seg-export'){
    if(state.seg.estimate == null) return toast('请先估算或选择快照', true);
    modalExport(); return;
  }
  if(act==='export-confirm'){
    const reason = ($('#expReason')||{}).value ? $('#expReason').value.trim() : '';
    if(reason.length < 5){ const b=$('#expErr'); if(b) b.textContent='请填写至少 5 个字的导出用途'; return; }
    approvals.unshift({ id:'ap_'+(9100+approvals.length), type:'敏感标签导出', refType:'export', refCode:'current_segment', target:`当前圈选 · ${fmt(state.seg.estimate||0)} 条`, applicant:'林岚', risk:'高', reason, time:nowLabel() });
    closeModal(); render();
    toast('导出申请已提交审批，审批后生成带水印文件');
    return;
  }

  /* ---- 任务 ---- */
  if(act==='job-detail'){ openJob(id); return; }
  if(act==='job-retry'){
    const j = jobs.find(x=>x.id===id);
    if(j){ j.status='queued'; j.err=''; j.progress=0; j.shards='待调度'; j.duration='—'; }
    render(); toast('任务已重新排队，按幂等键去重');
    return;
  }
  if(act==='job-refresh'){
    jobs.forEach(j=>{ if(j.status==='running'){ j.progress=Math.min(100,j.progress+9); if(j.progress>=100) j.status='succeeded'; } });
    render(); toast('任务状态已刷新');
    return;
  }

  /* ---- 用途 ---- */
  if(act==='purpose-select'){ state.usage.purpose = id; state.usage.filter='all'; render(); return; }
  if(act==='proj-filter'){ state.usage.filter = id; render(); return; }
  if(act==='auth-request'){ modalAuthRequest(id); return; }
  if(act==='auth-confirm'){
    const purpose = id;
    const domain = $('#authDomain').value;
    const reason = ($('#authReason')||{}).value ? $('#authReason').value.trim() : '';
    if(!domain) return toast('没有可申请的域', true);
    if(reason.length < 8){ const b=$('#authErr'); if(b) b.textContent='请填写至少 8 个字的申请理由'; return; }
    if(purpose==='music_rank' && MUSIC_RANK_FORBIDDEN.includes(domain)){ const b=$('#authErr'); if(b) b.textContent='付费 / 风险 / 健康属性禁止加入音乐推荐排序'; return; }
    approvals.unshift({ id:'ap_'+(9100+approvals.length), type:'用途扩围', refType:'usage_grant', refCode:purpose, refDomain:domain, target:`${(PURPOSES.find(p=>p.id===purpose)||{}).name} · 申请加入 ${DOMAINS[domain]} 域`, applicant:'林岚', risk:'高', reason, time:nowLabel() });
    closeModal(); render();
    toast('用途扩围申请已提交审批');
    return;
  }

  /* ---- 审批 ---- */
  if(act==='ap-tab'){ state.apTab = id; render(); return; }
  if(act==='approval-detail'){ openApproval(id); return; }
  if(act==='approve'){
    const a = approvals.find(x=>x.id===id); if(!a) return;
    approvals = approvals.filter(x=>x.id!==id);
    approveEffect(a);
    closeDrawer(); render();
    toast(`已通过：${a.type}，关联对象已更新并写入审计`);
    return;
  }
  if(act==='reject'){ modalReject(id); return; }
  if(act==='confirm-reject'){
    const reason = ($('#rejReason')||{}).value ? $('#rejReason').value.trim() : '';
    if(reason.length < 4){ const b=$('#rejErr'); if(b) b.textContent='请填写至少 4 个字的驳回理由'; return; }
    const a = approvals.find(x=>x.id===id); if(!a) return;
    approvals = approvals.filter(x=>x.id!==id);
    rejectEffect(a, reason);
    closeModal(); closeDrawer(); render();
    toast('已驳回，理由已同步申请人');
    return;
  }

  /* ---- 隐私 ---- */
  if(act==='toggle-personalization'){
    state.personalization = !state.personalization;
    logAudit({action: state.personalization?'开启个性化':'关闭个性化', target:'当前租户设置', tag:'—', purpose:'用户设置同步', meta: state.personalization?'恢复个人兴趣与序列投影':'停止个人兴趣与序列投影；历史值保留'});
    render();
    toast(state.personalization?'已开启个性化，投影恢复':'已关闭个性化，个人兴趣投影已停止');
    return;
  }
  if(act==='del-new'){ modalDeletion(); return; }
  if(act==='del-confirm'){
    const subjectId = $('#delSubject').value;
    const reason = $('#delReason').value;
    const scope = Array.from(document.querySelectorAll('.delScope:checked')).map(x=>x.value);
    if(!scope.length){ const b=$('#delErr'); if(b) b.textContent='至少选择一个清理范围'; return; }
    const c = customers[subjectId];
    const req = { id:'dr_'+(2203+deletionRequests.length), subjectId, subjectName:c?c.name:subjectId, scope, status:'pending', submitted:nowLabel(), completed:'', result:null, approvedBy:'' };
    deletionRequests.unshift(req);
    approvals.unshift({ id:'ap_'+(9100+approvals.length), type:'删除申请', refType:'deletion', refId:req.id, refCode:subjectId, target:`${req.subjectName} · ${subjectId} · ${reason}`, applicant:'林岚', risk:'高', reason:`${reason}；范围：${scope.join('、')}`, time:nowLabel() });
    closeModal(); state.view='privacy'; render();
    toast('删除申请已提交审批，通过后执行清理');
    return;
  }
  if(act==='del-detail'){ openDeletion(id); return; }

  /* ---- 审计 ---- */
  if(act==='audit-detail'){ openAudit(id); return; }
  if(act==='audit-export'){
    logAudit({action:'导出审计日志', target:'近 7 日审计', tag:'—', purpose:'合规归档', meta:'导出人 林岚；文件保留 180 天；不含完整敏感值'});
    render(); toast('审计日志已导出（演示），操作本身已记录');
    return;
  }
});

document.addEventListener('input', e=>{
  const k = e.target.dataset.input;
  if(!k) return;
  if(k==='q'){ state.q = e.target.value; state.focus='tagQ'; render(); }
  if(k==='audit-q'){ state.audit.q = e.target.value; state.focus='auditQ'; render(); }
});

document.addEventListener('change', e=>{
  const k = e.target.dataset.input;
  if(!k) return;
  if(k==='layer'){ state.layer = e.target.value; render(); }
  if(k==='status'){ state.status = e.target.value; render(); }
  if(k==='customer'){ state.customer = e.target.value; state.modalData={}; render(); }
  if(k==='seg-tenant'){ state.seg.tenant = e.target.value; state.seg.estimate=null; state.seg.stale=true; render(); }
  if(k==='audit-action'){ state.audit.action = e.target.value; render(); }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); closeDrawer(); }
});

/* =========================================================
   重置
   ========================================================= */
const SEED = JSON.parse(JSON.stringify({
  tags, sources, jobs, approvals, approvalHistory, audits, authz, deletionRequests, snapshots
}));

function resetDemo(){
  tags = JSON.parse(JSON.stringify(SEED.tags));
  sources = JSON.parse(JSON.stringify(SEED.sources));
  jobs = JSON.parse(JSON.stringify(SEED.jobs));
  approvals = JSON.parse(JSON.stringify(SEED.approvals));
  approvalHistory = JSON.parse(JSON.stringify(SEED.approvalHistory));
  audits = JSON.parse(JSON.stringify(SEED.audits));
  authz = JSON.parse(JSON.stringify(SEED.authz));
  deletionRequests = JSON.parse(JSON.stringify(SEED.deletionRequests));
  state.snapshots = JSON.parse(JSON.stringify(SEED.snapshots));
  PURPOSE_SEED.forEach(p=>{ const cur = PURPOSES.find(x=>x.id===p.id); if(cur) cur.domains = p.domains.slice(); });
  Object.keys(customers).forEach(k=>{
    const base = CUSTOMER_SEED[k];
    if(base){ customers[k] = JSON.parse(JSON.stringify(base)); }
  });
  state.subject='user'; state.view='overview'; state.customer='u_1024';
  state.seg = { logic:'AND', conds:defaultConds('user'), stale:false, estimate:null, estimating:false, tenant:'t_208', scenario:null };
  state.usage = { purpose:'music_rank', filter:'all' };
  state.personalization = true; state.apTab='pending';
  state.audit = { q:'', action:'all' };
  state.modalData = {}; state.q=''; state.layer='all'; state.status='all';
  closeDrawer(); closeModal(); render();
  toast('演示数据已重置');
}
const CUSTOMER_SEED = JSON.parse(JSON.stringify(customers));
const PURPOSE_SEED = PURPOSES.map(p=>({ id:p.id, domains:p.domains.slice() }));

render();
</script>
