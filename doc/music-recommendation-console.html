function allowed(t,action='play',intent={}){const p=profile();if(!visible(t))return '范围不匹配';if(!S.rights)return '资格服务不可确认';if(!t.approved)return '审核未通过';if(t.expired)return '许可已过期';if(!t.play)return '无播放许可';if(p.blocked.includes(t.author))return '作者已屏蔽';if(p.disliked.includes(t.id))return '不感兴趣';if(p.protect&&!t.safe)return '保护模式限制';if(action!=='play'&&!t[action])return '无'+({adapt:'参考改编',commercial:'商用',download:'下载'}[action]||action)+'许可';if(intent.instrumental&&t.vocal!=='无人声')return t.vocal==='未知'?'人声状态未知':'存在人声';if(intent.short&&t.duration!==30)return '不符合30秒';if(intent.commercial&&(!t.commercial||!t.use.includes(S.use)))return '用途未获许可';if(intent.genre&&t.genre!==intent.genre)return '风格条件未匹配';if(intent.excludeSad&&t.mood==='忧伤')return '排除忧伤';return '';}
function readset(){const base=['context.language','context.scene','content.quality','eligibility.decision'];if(profile().personal&&S.tagService&&!profile().expired)base.push(S.scope==='personal'?'user.listening.genre_pref':'member.creation.style_pref','session.recent_valid_plays');return base;}
function bucket(){let h=0;for(const c of (S.scope==='personal'?'u_1024':S.scope)+'固定盐-17')h=(h*31+c.charCodeAt(0))>>>0;return h%100;}
function resolveBundle(){return S.candidate&&bucket()<S.gray?S.candidate:S.active;}
function calculate(intent={},seed='',cfg=null){const p=profile(),source=tracks(),rejected=[],ok=[];for(const t of source){const reason=allowed(t,'play',intent);if(reason)rejected.push({id:t.id,title:t.title,reason});else ok.push(t);}const pref=p.personal&&S.tagService&&!p.expired?(S.scope==='personal'?p.listen:[p.creation]):[];const recent=p.personal&&S.tagService&&!p.expired?p.history.slice(-1)[0]:null;const seedTrack=getTrack(seed);const config=cfg||((resolveBundle().policy==='规则-v2'&&S.publishedConfig)?S.publishedConfig:{interest:35,quality:15,authorCap:2,pref:50,hot:35,explore:15});const score=t=>t.quality*config.quality/100+(pref.includes(t.genre)?config.interest*config.pref/50:0)+(recent===t.genre?20:0)+(seedTrack&&seedTrack.genre===t.genre?30:0)+(t.new?config.explore/2:config.hot/8);ok.sort((a,b)=>score(b)-score(a));const counts={},seen=new Set(),items=[];for(const t of ok){if(t.id===seed||seen.has(t.id)||(counts[t.author]||0)>=config.authorCap)continue;seen.add(t.id);counts[t.author]=(counts[t.author]||0)+1;items.push({id:t.id,score:Math.round(score(t)*10)/10,reason:seedTrack?'已授权种子曲的标签相似':pref.includes(t.genre)?'匹配当前范围的显式偏好':t.new?'合格新作探索':'合规内容与质量排序'});}return {source:source.length,qualified:ok.length,rejected,items:items.slice(0,6)};}
function recommend(scene='首页',intent={},seed=''){const r=calculate(intent,seed),id='请求-'+String(++S.seq).padStart(4,'0');const bundle={...resolveBundle()};const req={...r,id,scope:S.scope,scene,intent:{...intent},seed,bundle,reads:readset(),personalization:profile().personal?'on':'off',consent:profile().consent,degrade:!S.rights?'资格不可确认 · 安全关闭':!S.tagService||profile().expired?'画像不可用 · 合规热榜':!S.model?'模型不可用 · 标签与规则降级':'标签匹配基线',time:new Date().toLocaleTimeString('zh-CN')};S.requests.unshift(req);S.result=req;return req;}
function invalidate(){S.playing=null;S.result=null;profile().consent++;}
function stats(){const req=S.requests.filter(r=>r.scope===S.scope),ev=S.events.filter(e=>e.scope===S.scope);return {served:req.reduce((a,r)=>a+r.items.length,0),exposure:ev.filter(e=>e.type==='有效曝光'&&e.status==='接受').length,play:ev.filter(e=>e.type==='有效播放'&&e.status==='接受').length,req:req.length};}

.map(([a,b])=>`<div class="barrow"><span>${a}</span><div class="bar"><i style="width:${b*2}%"></i></div><span>${b}%</span></div>`).join('')}<small>示意分布 · 非线上采样</small></div>`)}</div><div class="grid equal">${panel('在线链路 / 每一步都可追溯',`<div class="pb">${[['01','身份与同意','按 scope + consent_version 隔离画像与缓存'],['02','多路召回','偏好 50% / 热榜 35% / 探索 15% · 示例配额'],['03','硬过滤与规则排序','许可、屏蔽、保护不可由白名单覆盖'],['04','下发与事件','请求固定 bundle；去重后更新聚合']].map(x=>`<div class="step"><span class="num">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}<div class="row" style="margin-top:14px">${btn('发起一次首页请求','request')}${btn('进入手机体验 →','nav',1,'primary')}</div></div>`)}${panel('依赖状态与降级演练',`<div class="pb">${[['标签服务',S.tagService,'tagService','关闭后不读取兴趣，回退合规热榜'],['模型服务',S.model,'model','关闭后在线规则推荐仍可用；生成被阻断'],['资格与许可服务',S.rights,'rights','不可确认时安全关闭，不以缓存私有素材兜底']].map(x=>`<div class="toggleline"><div><b>${x[0]}</b><p>${x[3]}</p></div>${btn(x[1]?'模拟故障':'恢复服务','dependency',x[2],'small')}</div>`).join('')}<p style="margin-top:15px">当前告警：${!S.rights?'资格服务不可用，候选全部关闭':!S.model?'生成暂停，在线链路降级':!S.tagService?'画像缺失，使用非个性化内容':'无模拟故障；语义能力仍未验证'}</p></div>`)}</div>`;}
function songs(req){if(!req)return '<div class="empty">点击下方按钮，开始一次新的发现</div>';if(!req.items.length)return '<div class="empty">没有满足硬条件的音乐。<br>可以放宽风格或时长，不会放宽授权。</div>';return req.items.map((o,i)=>{const t=getTrack(o.id);if(!t||allowed(t,'play',req.intent))return '';return `<div class="song"><div class="art">${String(i+1).padStart(2,'0')}</div><div class="song-main"><b>${esc(t.title)}</b><small>${esc(t.genre)} · ${t.duration}秒 · ${esc(t.vocal)}</small><small>${esc(o.reason)}</small><div class="song-tools">${btn('播放','play',t.id)}${btn('类似','similar',t.id)}${btn(profile().collect.includes(t.id)?'已收藏':'收藏','collect',t.id)}${btn('不喜欢','dislike',t.id)}${btn('屏蔽作者','block',t.id)}</div></div></div>`;}).join('');}

有值得听见的音乐。'}</p></div><div class="row between" style="margin-top:16px"><b>${S.tab==='连续播放'?'接下来听':'推荐歌单'}</b>${btn('换一组','refresh','','small')}</div>${songs(r)}<div class="row" style="margin-top:15px">${btn('获取推荐','request','','primary')}${btn('换一种风格','different')}${btn('模拟可见曝光','impress','','',!r||!r.items.length)}</div>`;

function playerInfo(){const p=S.playing;if(!p)return '<p style="margin:6px 0;font-size:11px">尚未播放 · 选择上方作品开始</p>';const t=getTrack(p.id);if(!t)return '';return `<div class="row between"><b>${esc(t.title)}</b><small id="playSeconds">${p.seconds} / ${t.duration}秒</small></div><progress id="progress" max="${t.duration}" value="${p.seconds}"></progress><div class="row">${btn(p.paused?'继续':'暂停','pause','','small')}${btn('推进15秒','advance','','small')}${btn('主动切歌','skipplay','','small')}${btn('模拟播放错误','playerror','','small')}</div>`;}
function privacyControls(){const p=profile();return [['个性化推荐','personal','关闭后后续请求不读兴趣和历史序列'],['保护模式','protect','只限制资格，不参与时长或付费优化'],['回访授权','recall','每次发送重新核验授权']].map(([n,k,d])=>`<div class="toggleline"><div><b>${n}</b><p>${d}</p></div>${btn(p[k]?'已开启':'已关闭','toggle',k,'toggle')}</div>`).join('')+`<div class="row" style="margin-top:14px">${btn('清空兴趣','clearInterest','','danger small')}${btn('删除历史行为','clearHistory','','danger small')}</div>`;}
function profiles(){const p=profile(),rows=[['听歌风格',p.listen.join('、')||'未选择','用户显式','2026-12-17','听歌排序'],['创作风格',p.creation||'未设置','成员显式','2026-12-17',S.scope==='personal'?'个人创作':'本租户创作'],['会话序列',p.history.join(' → ')||'暂无有效行为','模拟播放','30分钟','连续播放'],['音乐偏好预测','爵士 · 置信度0.62','规则推断','2026-11-01','已过期，不读取'],['消费能力 / 风险','禁止投影','经营 / 风控','不适用','永不参与音乐排序']];return `<div class="notice">当前主键 <b class="mono">${esc(scopeKey())}</b>。成员画像只属于当前租户；企业行为不回写个人兴趣。来源不做全局优先级覆盖，权威事实不可被模型替代。</div><div class="grid equal">${panel('当前范围偏好',`<div class="pb"><label>听歌风格（个人与成员分别存储）<select id="listenPref">${opt(['国风','爵士','钢琴','电子'],p.listen[0])}</select></label><label>${S.scope==='personal'?'个人':'租户成员'}创作偏好<select id="creationPref">${opt(['国风','爵士','钢琴','电子'],p.creation)}</select></label><div class="row">${btn('保存当前范围偏好','saveProfile','','primary')}${btn(p.expired?'恢复有效期':'模拟画像过期','expireProfile')}</div><small>变更会使当前列表失效；听歌与创作字段不会互相覆盖。</small></div>`)}${panel('同意、保护与数据权利',`<div class="pb">${privacyControls()}<small>同意版本 cv_${p.consent} · 兴趣删除不等于行为删除；删除范围详见治理任务。</small></div>`)}</div>${panel('特征目录与消费合同',table(['特征','当前值','来源','有效期','用途'],rows.map(tr)))}<div class="grid equal">${panel('允许与禁止的读集',`<div class="pb">${kv('当前实际投影',readset().map(x=>`<div class="mono pass">${x}</div>`).join(''))}${kv('禁止进入排序','<span class="mono error">user.billing.*<br>user.risk.*<br>tenant.health.*</span>')}${kv('保护属性','仅消费身份服务的资格决定，不读取原始年龄或敏感值')}</div>`)}${panel('即时反馈',`<div class="pb"><h3>已屏蔽作者</h3>${p.blocked.length?p.blocked.map(a=>`<div class="row between" style="margin-bottom:10px">${esc(a)}${btn('撤销屏蔽','unblock',a,'small')}</div>`).join(''):'<p>暂无屏蔽；手机体验中的屏蔽会即时反映到这里。</p>'}<h3 style="margin-top:15px">不感兴趣作品</h3>${p.disliked.length?p.disliked.map(id=>`<div class="row between">${esc(getTrack(id)?.title||'不可访问作品')}${btn('撤销','undoDislike',id,'small')}</div>`).join(''):'<small>暂无作品负反馈</small>'}</div>`)}</div>`;}
function policy(){const p=S.policy;return `<div class="row" style="margin-bottom:16px">${tag(p.status,'orange')}${tag('创建人：'+p.creator)}<small>编辑任何字段后需重新校验、试算、审批。当前草稿不影响线上组合。</small></div><div class="grid">${panel('场景策略 / 首页发现',`<div class="pb"><div class="formgrid">${[['偏好召回配额 %','pref'],['热榜召回配额 %','hot'],['新作召回配额 %','explore'],['兴趣匹配权重','interest'],['内容质量权重','quality'],['同作者上限','authorCap']].map(([a,b])=>`<label>${a}<input type="number" min="0" max="100" data-policy="${b}" value="${p[b]}"></label>`).join('')}<label>排序特征<select data-policy="feature">${opt(['允许特征','user.billing.balance','user.risk.score','tenant.health.churn'],p.feature)}</select></label><label>查询向量空间<select data-policy="space">${opt(['标签空间-v1','音频空间-v2（不兼容）'],p.space)}</select></label></div><label>变更原因（至少5字）<textarea rows="2" maxlength="500" data-policy="reason">${esc(p.reason)}</textarea></label><div class="notice">固定硬过滤：身份、许可、审核、屏蔽、保护、明确人声要求。运营白名单只在合格集合内调整排序，无法关闭这些规则。</div><div class="row">${btn('① 校验规则','validate','','primary')}${btn('② 运行试算','trial')}${btn('③ 提交独立审批','submit')}</div></div>`)}${panel('校验与候选漏斗',`<div class="pb">${p.errors.length?`<div class="notice error">${p.errors.map(esc).join('<br>')}</div>`:p.validated?'<p class="pass">校验通过：配额、特征白名单与空间契约一致。</p>':'<p>尚未校验。可选择禁止特征或不兼容空间验证阻断。</p>'}${p.trial?`<div class="barrow"><span>范围内召回</span><div class="bar"><i style="width:100%"></i></div><b>${p.trial.source}</b></div><div class="barrow"><span>硬过滤通过</span><div class="bar"><i style="width:${p.trial.qualified/p.trial.source*100}%"></i></div><b>${p.trial.qualified}</b></div><div class="barrow"><span>重排输出</span><div class="bar"><i style="width:${p.trial.items.length/p.trial.source*100}%"></i></div><b>${p.trial.items.length}</b></div>${p.trial.items.map(o=>`<div class="kv"><span>${esc(getTrack(o.id)?.title)}</span><span>规则得分 ${o.score}</span></div>`).join('')}<small>试算使用草稿，不写下发、曝光或线上版本。</small>`:'<div class="empty">试算后展示过滤与重排结果</div>'}</div>`)}</div>${panel('发布前检查项',table(['检查项','要求','状态'],[['特征白名单','拒绝 billing / risk / health',p.validated?tag('已校验'):tag('待校验','warn')],['召回配额','合计100%；全部非负整数',p.validated?tag('已校验'):tag('待校验','warn')],['空间契约','space / encoder / index 同组兼容',p.validated?tag('已校验'):tag('待校验','warn')],['试算覆盖','当前范围候选可解释',p.tested?tag('已试算'):tag('待试算','warn')],['审批分离','创建人与审批人不同',tag(p.status,'orange')]].map(tr)),btn('前往实验与治理 →','nav',9,'small'))}`;}
function diagnostics(){const rs=S.requests.filter(r=>r.scope===S.scope&&r.id.includes(S.requestQuery)),ev=S.events.filter(e=>e.scope===S.scope&&(S.eventFilter==='全部'||e.status===S.eventFilter));return `<div class="notice">下发不会自动计入曝光。使用手机“模拟可见曝光”显式模拟可见阈值；播放无需伪造曝光。事件去重、归因和状态皆为本地演示。</div>${panel('请求列表',`<div class="toolbar"><input id="requestQuery" aria-label="按请求编号搜索" placeholder="按请求编号筛选" value="${esc(S.requestQuery)}">${btn('筛选','filterRequests')}${btn('新增首页请求','request','','primary')}</div>`+table(['请求 / 场景','固定版本','读集','漏斗','降级','操作'],rs.map(r=>tr([`<b>${esc(r.id)}</b><small>${esc(r.scene)} · ${r.time}</small>`,esc(r.bundle.id),`${r.reads.length}项 · ${r.personalization==='on'?'个性化开启':'个性化关闭'}`,`${r.source} → ${r.qualified} → ${r.items.length}`,esc(r.degrade),btn('查看链路','trace',r.id,'small')]))))}${panel('事件收集与幂等验证',`<div class="toolbar"><select id="eventFilter" aria-label="事件状态">${opt(['全部','接受','重复','拒绝','隔离'],S.eventFilter)}</select>${btn('重传最后事件 ×10','replay')}${btn('注入非法归因','badEvent')}${btn('注入未来时间','futureEvent')}<small>相同 event_id 与曝光指标键不会重复聚合</small></div>`+table(['事件编号','类型 / 请求','去重键','接收结果','备注'],ev.slice(0,35).map(e=>tr([esc(e.id),`${esc(e.type)}<small>${esc(e.request||'无有效请求')}</small>`,`<span class="mono">${esc(e.key)}</span>`,tag(e.status,e.status==='接受'?'':e.status==='重复'?'warn':'red'),esc(e.note)]))))}`;}
function models(){return `<div class="grid equal">${panel('模型能力地图',table(['能力','当前判断','在线用法'],[['音乐生成',tag(S.model?'模拟可用':'模拟不可用',S.model?'':'red'),'需用户确认；实际权重未验证'],['DSP / 标签分析',tag('模拟分析'),'异步任务，不修改许可'],['文本—音频对齐',tag('未验证','warn'),'禁用；字典标签匹配替代'],['双塔 / 序列模型',tag('未验证','warn'),'不将随机投影当训练模型'],['相似音乐',tag('标签基线'),'同风格、速度等标签匹配']].map(tr)),btn(S.model?'模拟模型不可用':'恢复模型','dependency','model','small'))}${panel('不可变空间契约',`<div class="pb">${kv('当前策略',esc(S.active.policy))}${kv('编码器',esc(S.active.encoder))}${kv('空间 / 索引',esc(S.active.space)+' / '+esc(S.active.index))}${kv('特征版本',esc(S.active.schema))}<p style="margin-top:15px">示例为标签空间，不宣称具备通用音频语义能力。切换空间必须同时校验编码器、索引与特征版本。</p>${btn('前往策略验证不兼容空间','nav',3)}</div>`)}</div>${panel('异步音乐理解任务',table(['任务 / 内容','状态','人声状态','置信度','版本与幂等键','操作'],S.analysis.filter(a=>getTrack(a.item)).map(a=>tr([`${a.id}<small>${esc(getTrack(a.item).title)}</small>`,tag(a.status,a.status==='失败'?'red':a.status==='成功'?'':'warn'),esc(a.vocal),`${Math.round(a.confidence*100)}%`,`<span class="mono">${a.item}:audio-hash-01:管线-v1</span>`,`${btn(a.status==='成功'?'重跑分析':'执行 / 重试','analyze',a.id,'small',a.status==='运行中')}${btn('人工复核','reviewVocal',a.item,'small')}`]))))}<div class="notice">未知人声不等于无人声。分析仅更新音乐特征，不赋予播放、下载或商业授权；任务失败也不撤销已有合格作品的播放资格。</div>`;}
function exploration(){return `<div class="stats">${[['探索预算上限',S.budget,'每曲有效曝光，示例配置'],['最低有效样本',100,'未达门槛不判差'],['准入原则','审核通过','分析、许可、质量同时满足'],['质量评估','同类对照','置信区间宽时保持探索']].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>${panel('新作探索候选池',`<div class="toolbar"><label style="margin:0">每曲预算 <input id="budget" type="number" min="100" max="1000" value="${S.budget}" style="width:100px;display:inline"></label>${btn('更新预算','budget')}<small>最多1000；有效样本按不同模拟用户生成，异常事件不计入</small></div>`+table(['作品','准入','有效曝光 / 有效播放','样本判断','分发状态','操作'],tracks().filter(t=>t.new).map(t=>{const e=S.exploreData[t.id];return tr([`${esc(t.title)}<small>${t.genre} · 质量 ${t.quality}</small>`,!allowed(t)&&S.analysis.find(a=>a.item===t.id)?.status==='成功'?tag('可准入'):tag('待审核或分析','warn'),`${e.n} / ${e.good}`,e.n<100?tag('样本不足，不判差','warn'):tag('达到观察门槛'),tag(e.status,'orange'),`${btn('准入复核','admit',t.id,'small')}${btn('+25有效样本','sample',t.id,'small')}${btn('评估扩量 / 收缩','evaluate',t.id,'small')}`]);})))}${panel('探索决策原则',`<div class="pb"><div class="grid equal"><div><h3>不是流量奖励机制</h3><p>新曲初始100次有效曝光只是待验证起点；按风格与时长分层，不能把创作者等级当成永久特权。</p></div><div><h3>不把“零收藏”当失败</h3><p>小样本保持探索；本演示以有效播放率的95% Wilson区间与同类45%基线比较，区间交叉则继续观察。</p></div></div></div>`)}`;}
const templates=[{name:'青山轻行',style:'国风',desc:'古筝 / 轻打击 / 明亮；适合短视频叙事'},{name:'雨夜慢调',style:'爵士',desc:'电钢琴 / 低音提琴 / 平静；适合城市夜景'},{name:'微光脉冲',style:'电子',desc:'合成器 / 轻鼓点 / 明亮；适合产品展示'}];
function creation(){const price=S.genDuration/30*12;return `<div class="notice">仅模拟生成模块：无真实扣费、无音频产物。模板浏览、参数编辑、参考曲选择都不会创建任务或改变积分；预估积分只在确认时锁定。</div><div class="grid equal"><div>${templates.map((t,i)=>`<div class="template ${S.template===i?'selected':''}"><div class="row between"><div><span class="index">0${i+1}</span> <b>${t.name}</b></div>${tag('模板-v1')}</div><p>${t.desc}</p>${btn(S.template===i?'当前模板':'选择并编辑','template',i,S.template===i?'primary':'')}</div>`).join('')}</div>${panel('编辑你的创作参数',`<div class="pb"><label>风格<select id="genStyle">${opt(['国风','爵士','电子','钢琴'],S.genStyle)}</select></label><label>时长<select id="genDuration">${[30,60,120].map(x=>`<option value="${x}" ${x===S.genDuration?'selected':''}>${x}秒</option>`).join('')}</select></label><label>参考曲（参考 / 改编许可独立复核）<select id="reference"><option value="">不使用参考曲</option>${tracks().filter(t=>!allowed(t)).map(t=>`<option value="${t.id}" ${S.reference===t.id?'selected':''}>${esc(t.title)} · ${t.adapt?'允许参考':'仅允许播放'}</option>`).join('')}</select></label><label>模拟生成终态<select id="genOutcome">${opt(['成功','失败'],S.genOutcome)}</select></label>${kv('预估积分',`<b style="font-size:22px;color:var(--accent)">${price}</b> 模拟积分 · 实际余额不变`)}${kv('模型状态',S.model?tag('模拟可用 · 实际能力未验证','warn'):tag('不可用，禁止提交','red'))}<div class="row" style="margin-top:17px">${btn('预览并确认生成','generate','','primary',!S.model)}</div><small>只传经许可的风格、节奏和乐器摘要，不复制歌词、旋律或身份音色。</small></div>`)}</div>${panel('生成任务 / 以终态归因',table(['任务','模板 / 参数','预估积分','状态','归因','结果'],S.generation.filter(g=>g.scope===S.scope).map(g=>tr([g.id,`${esc(g.template)}<small>${esc(g.style)} · ${g.duration}秒</small>`,g.price+'（模拟）',tag(g.status,g.status==='失败'?'red':g.status==='成功'?'':'warn'),esc(g.request||'直接创作'),g.status==='成功'?'已形成模拟作品记录，无音频':g.status==='失败'?'冻结模拟积分已释放，不记成功转化':'已确认参数，等待模拟终态']))))}`;}
function assets(){const list=tracks().filter(t=>t.title.includes(S.assetQuery)&&(!S.assetOnly||!allowed(t,'commercial',{commercial:true})));return `<div class="notice">当前：<b>${scopeName()}</b> / 同一用户 u_1024。个人空间仅有公共作品；租户私有标题、列表、理由和诊断均按范围隔离。页面中的“下载”只生成许可核验记录，不签发真实文件地址。</div>${panel('素材目录与用途',`<div class="toolbar"><input id="assetQuery" placeholder="搜索当前范围内作品" aria-label="搜索素材" value="${esc(S.assetQuery)}"><select id="use" aria-label="商用用途">${opt(['短视频','广告','游戏'],S.use)}</select><label style="margin:0"><input type="checkbox" id="assetOnly" ${S.assetOnly?'checked':''}> 仅看当前用途可商用</label>${btn('应用筛选','filterAssets','','primary')}</div>`+table(['素材 / 范围','风格 / 人声','播放','下载','商用','参考改编','状态与操作'],list.map(t=>tr([`<b>${esc(t.title)}</b><small>${t.tenant?'本租户私有':'公共素材'} · ${t.duration}秒</small>`,`${t.genre}<small>${t.vocal}</small>`,tag(t.play?'允许':'拒绝',t.play?'':'red'),tag(t.download?'允许':'拒绝',t.download?'':'red'),tag(t.commercial&&t.use.includes(S.use)?'用途匹配':'不匹配',t.commercial&&t.use.includes(S.use)?'':'warn'),tag(t.adapt?'允许':'拒绝',t.adapt?'':'red'),`<div class="row">${btn('许可详情','license',t.id,'small')}${btn('下载复核','download',t.id,'small')}${btn('确认采用','adopt',t.id,'small')}${btn(t.expired?'恢复许可':'模拟过期','expire',t.id,'small')}</div>${t.expired?tag('已过期','red'):''}`]))))}<div class="grid equal">${panel('下载签发前复核记录',table(['作品','用途','结论'],S.downloads.filter(x=>x.scope===S.scope).map(x=>tr([esc(x.title),esc(x.use),tag(x.status,x.status==='允许模拟下载'?'':'red')]))))}${panel('企业采用记录',table(['作品','用途','状态'],S.adoptions.filter(x=>x.scope===S.scope).map(x=>tr([esc(x.title),esc(x.use),tag('模拟采用已确认')]))))}</div>`;}
function governance(){const p=S.policy;return `<div class="grid equal">${panel('独立审批与灰度',`<div class="pb">${kv('草稿状态',tag(p.status,'orange'))}${kv('创建 / 操作身份',esc(p.creator)+' / '+esc(S.actor))}${kv('稳定分桶',`桶 ${bucket()} / 100 · ${S.scope==='personal'?'按 user_id':'按 tenant_id'} · 固定盐`)}${kv('灰度流量',`${S.gray}% · 当前范围${S.candidate&&bucket()<S.gray?'命中新组合':'保持稳定组合'}`)}<div class="row" style="margin:18px 0">${btn('独立审批通过','approve','','primary')}${btn('驳回草稿','reject')}${btn('发布 / 扩大灰度','publish')}${btn('整组回滚','rollback','','danger')}</div><p>演示阶梯：1% → 5% → 20% → 50% → 100%。创建人无法自审；在右上角切换为审核周。灰度请求固定对应整组版本。</p><div class="row">${btn('触发越权护栏','guard','','danger small')}${btn('解除演练告警','clearGuard','','small')}</div>${S.guard?'<p class="error">护栏已触发，暂停扩量并回退整组。</p>':''}</div>`)}${panel('当前不可变组合清单',`<div class="pb">${Object.entries(S.active).map(([k,v])=>kv(({id:'稳定组合',policy:'策略',model:'排序模型',schema:'特征 schema',space:'向量空间',encoder:'查询编码器',index:'不可变索引'})[k],esc(v))).join('')}${S.candidate?kv('灰度候选',esc(S.candidate.id)):'<small>尚无灰度候选。回滚会同时恢复以上所有引用。</small>'}</div>`)}</div>${panel('护栏与观察窗',table(['指标','演示门槛','当前处理'],[['越权 / 违规推荐','任何1例立即止损',S.guard?tag('已整组回滚','red'):tag('无模拟告警')],['P95 / 错误率','超过预算持续5分钟','真实指标未接入，不宣称通过'],['有效播放下降','相对下降5%且样本充足','小样本不作收益判断'],['分桶与观察窗','固定盐 / 固定口径 / 7日示例','不每日偷看显著性提前结束']].map(tr)))}<div class="grid equal">${panel('回访授权与频控',`<div class="pb">${kv('当前授权',profile().recall?tag('已订阅'):tag('已退订','warn'))}${kv('本轮发送',profile().sent+' / 1次')}${kv('打开时校验','重新检查作品资格，不沿用人群快照授权')}<div class="row" style="margin-top:14px">${btn(profile().recall?'退订':'订阅','toggle','recall')}${btn('发送回访消息','recall')}</div></div>`)}${panel('删除任务 / 数据权利',table(['任务','删除范围','状态 / 操作'],S.deletions.filter(d=>d.scope===S.scope).map(d=>tr([d.id,esc(d.kind),`${tag(d.status,'warn')} ${d.status==='待执行'?btn('执行模拟清理','executeDelete',d.id,'small'):''}`]))))}</div>${panel('治理审计（仅当前范围）',table(['时间','操作人','动作','前后结果 / 目的'],S.audits.filter(a=>a.scope===S.scope).slice(0,30).map(a=>tr([a.time,esc(a.actor),esc(a.action),esc(a.detail)]))))}`;}
function openLayer(title,body,drawer=false,foot=''){lastFocus=document.activeElement;$('#layers').innerHTML=`<div class="overlay ${drawer?'isdrawer':''}"><section class="dialog ${drawer?'drawer':''}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div class="ph"><h2 id="dialogTitle">${esc(title)}</h2>${btn('关闭 ×','close','','small')}</div><div class="pb">${body}</div>${foot?`<footer>${foot}</footer>`:''}</section></div>`;$('#layers button')?.focus();}
function closeLayer(){const old=lastFocus;$('#layers').innerHTML='';confirmAction=null;if(old&&old.isConnected)old.focus();else $('#nav .active')?.focus();}
function confirm(title,body,action){openLayer(title,body,false,btn('取消','close')+btn('确认继续','confirm','','primary'));confirmAction=action;}
function trace(id){const r=S.requests.find(r=>r.id===id&&r.scope===S.scope);if(!r)return;const rejected=r.rejected.map(x=>tr([esc(x.title),esc(x.reason)]));audit('查看请求诊断',id+' · 用途：原型联调');openLayer('请求链路 · '+id,kv('上下文',`${esc(r.scene)} / ${esc(r.scope)} / cv_${r.consent}`)+kv('固定组合',esc(r.bundle.id))+kv('个性化状态',r.personalization)+kv('降级原因',esc(r.degrade))+`<h3 style="margin-top:20px">实际特征读集</h3><pre>${esc(r.reads.join('\n'))}</pre><h3>范围内过滤原因</h3>${table(['作品','原因'],rejected)}<h3 style="margin-top:20px">排序与重排</h3>${table(['作品','分值','理由'],r.items.map(x=>tr([esc(getTrack(x.id)?.title||'已不可访问'),x.score,esc(x.reason)])))}<h3 style="margin-top:20px">完整绑定版本</h3><pre>${esc(JSON.stringify(r.bundle,null,2))}</pre><small>不会展示其他租户候选、标题或原始敏感画像。</small>`,true);}
function recordEvent(type,id,req,custom={}){const eid=custom.id||'事件-'+(++S.seq),r=req||S.result;let status='接受',note='持久化及聚合均为模拟';const key=custom.key||`${S.scope}:${r?.id||'direct'}:${id}:${type}`;if(custom.invalid||!r||r.scope!==S.scope||!r.items.some(x=>x.id===id)){status='拒绝';note='归因不合法：scope / request / item 不匹配';}else if(custom.future){status='隔离';note='事件时间超过未来5分钟';}else if(S.dedup.includes(eid)||S.events.some(e=>e.key===key&&e.status==='接受')){status='重复';note='相同事件或指标键不重复聚合';}else S.dedup.push(eid);const e={id:eid,key,scope:S.scope,request:r?.id||'',type,status,note,item:id};S.events.unshift(e);return e;}
function startPlay(id){const t=getTrack(id),r=S.result;if(!t||allowed(t,'play',r?.intent||{})){toast('播放被硬许可或当前条件阻断');return;}if(!r||!r.items.some(x=>x.id===id)){toast('先获取当前请求中的候选');return;}const session='播放会话-'+(++S.seq);S.playing={id,seconds:0,paused:false,session,request:r.id,effective:false};recordEvent('模拟起播',id,r,{key:session+':start'});render();}
function advance(seconds){const p=S.playing;if(!p||p.paused)return;const t=getTrack(p.id),r=S.requests.find(x=>x.id===p.request&&x.scope===S.scope);if(!t||allowed(t,'play',r?.intent||{})){S.playing=null;render();toast('许可或资格变化，已停止模拟播放');return;}p.seconds=Math.min(t.duration,p.seconds+seconds);if(!p.effective&&t.duration>=10&&p.seconds>=Math.min(30,t.duration*.5)){p.effective=true;recordEvent('有效播放',t.id,r,{key:p.session+':effective'});if(profile().personal)profile().history.push(t.genre);}if(p.seconds===t.duration){p.paused=true;recordEvent('模拟完播',t.id,r,{key:p.session+':end'});}if($('#playerInfo'))$('#playerInfo').innerHTML=playerInfo();}
function validate(){const p=S.policy,errors=[];if(![p.pref,p.hot,p.explore].every(n=>Number.isInteger(n)&&n>=0&&n<=100)||p.pref+p.hot+p.explore!==100)errors.push('召回配额必须为0—100整数且合计100%。');if(![p.interest,p.quality].every(n=>Number.isFinite(n)&&n>=0&&n<=100))errors.push('权重须处于0—100。');if(!Number.isInteger(p.authorCap)||p.authorCap<1||p.authorCap>6)errors.push('同作者上限须为1—6整数。');if(p.feature!=='允许特征')errors.push('禁止消费能力、风险和租户流失特征进入音乐排序。');if(p.space!==B2.space)errors.push('空间不兼容：查询编码器与索引均绑定标签空间-v1。');if(p.reason.trim().length<5)errors.push('变更原因至少5字。');p.errors=errors;p.validated=!errors.length;p.tested=false;p.trial=null;return !errors.length;}
function resetPolicyValidation(){S.policy.validated=false;S.policy.tested=false;S.policy.status='草稿';S.policy.errors=[];S.policy.trial=null;S.policy.creator=S.actor;}
function rollback(reason){const before=S.active.id+(S.candidate?' + '+S.candidate.id:'');S.active={...S.previous};S.candidate=null;S.gray=0;S.policy.status='已回滚';audit('整组回滚',`${before} → ${S.active.id}；${reason}`);S.result=null;S.playing=null;}
function parseSearch(){S.query=$('#query')?.value||S.query;const q=S.query;const genre=['国风','爵士','钢琴','电子'].find(g=>q.includes(g))||'';S.intent={instrumental:!!$('#instrumental')?.checked||/无人声|无歌词|纯音乐|纯器乐/.test(q),short:!!$('#short')?.checked||/30秒|三十秒/.test(q),commercial:!!$('#commercial')?.checked||/商用|广告/.test(q),genre,excludeSad:/别太伤感|不伤感|不要忧伤|不忧伤/.test(q)};recommend('自然语言找音乐',S.intent);}

saveProfile:()=>{profile().listen=[$('#listenPref').value];profile().creation=$('#creationPref').value;profile().expired=false;invalidate();audit('修改偏好',scopeKey()+' · 听歌和创作分离保存');render();toast('当前范围偏好已保存');},expireProfile:()=>{profile().expired=!profile().expired;invalidate();render();},dependency:a=>{S[a]=!S[a];S.result=null;S.playing=null;audit('依赖演练',a+' = '+S[a]);render();},validate:()=>{validate();audit('策略校验',S.policy.validated?'通过':'阻断：'+S.policy.errors.join('；'));render();},trial:()=>{if(!S.policy.validated){toast('请先通过规则校验');return;}S.policy.trial=calculate({},'',S.policy);S.policy.tested=true;audit('草稿试算',`${S.policy.trial.items.length}个合法候选`);render();},submit:()=>{const p=S.policy;if(!p.validated||!p.tested){toast('必须先通过校验并完成试算');return;}if(!p.trial.items.length){toast('当前范围无合格候选，不能提交审批');return;}p.status='待审批';p.creator=S.actor;audit('提交独立审批',p.reason);render();},
trace,filterRequests:()=>{S.requestQuery=$('#requestQuery').value.trim();render();},replay:()=>{const e=S.events.find(x=>x.scope===S.scope&&x.status==='接受');if(!e){toast('请先在手机模拟曝光或播放');return;}const r=S.requests.find(x=>x.id===e.request&&x.scope===S.scope);for(let i=0;i<10;i++)recordEvent(e.type,e.item,r,{id:e.id,key:e.key});render();toast('已重传10次，接受数未增长');},badEvent:()=>{recordEvent('有效曝光','未下发作品',S.result,{invalid:true});render();},futureEvent:()=>{const r=S.requests.find(x=>x.scope===S.scope&&x.items.length);if(!r){toast('先发起一次含候选的请求');return;}recordEvent('有效曝光',r.items[0].id,r,{future:true});render();},
analyze:a=>{const task=S.analysis.find(x=>x.id===a&&getTrack(x.item));if(!task||task.status==='运行中')return;if(!S.model){toast('模型不可用，任务保持原状态');return;}task.status='运行中';audit('启动分析',task.id+' · 幂等键保持不变');render();const state=S;setTimeout(()=>{if(S!==state)return;task.status=S.model?'成功':'失败';if(S.model){task.vocal=task.item==='w05'?'未知':'无人声';task.confidence=task.item==='w05'?.68:.92;const t=S.tracks.find(x=>x.id===task.item);t.vocal=task.vocal;}if(S.page===5)render();},1000);},reviewVocal:a=>{const t=getTrack(a);if(!t)return;openLayer('人工复核 · '+t.title,`<p>仅修改人声内容标签，不会修改权威许可。</p><label>人声状态<select id="vocalReview">${opt(['无人声','有人声','未知'],t.vocal)}</select></label>`,false,btn('保存复核','saveVocal',a,'primary'));},saveVocal:a=>{const t=getTrack(a);if(!t)return;t.vocal=$('#vocalReview').value;const j=S.analysis.find(x=>x.item===a);if(j){j.vocal=t.vocal;j.confidence=1;}audit('人工修正人声',t.title+' → '+t.vocal);closeLayer();S.result=null;render();},
budget:()=>{const n=+$('#budget').value;if(!Number.isInteger(n)||n<100||n>1000){toast('预算须为100—1000整数');return;}S.budget=n;audit('调整探索预算',String(n));render();},admit:a=>{const t=getTrack(a),e=S.exploreData[a];if(!t||!e)return;const j=S.analysis.find(x=>x.item===a);if(allowed(t)||j?.status!=='成功'||t.quality<80){toast('准入失败：需审核、许可、分析成功且质量≥80');return;}e.status='探索中';audit('新作准入',t.title);render();},sample:a=>{const t=getTrack(a),e=S.exploreData[a];if(!t||!e)return;if(allowed(t)||S.analysis.find(x=>x.item===a)?.status!=='成功'||e.status==='待准入'){toast('先完成分析并通过准入复核');return;}if(e.n>=S.budget){toast('达到预算上限，请调整预算后继续');return;}const add=Math.min(25,S.budget-e.n);e.n+=add;e.good+=Math.round(add*(a==='w06'?.72:.25));audit('探索模拟样本',t.title+' 新增'+add+'个不同用户有效曝光');render();},evaluate:a=>{const e=S.exploreData[a];if(!e)return;if(e.n<100){toast('样本不足100，保持探索，不判差');return;}const p=e.good/e.n,z=1.96,den=1+z*z/e.n,mid=(p+z*z/(2*e.n))/den,half=z*Math.sqrt(p*(1-p)/e.n+z*z/(4*e.n*e.n))/den;const lo=mid-half,hi=mid+half;e.status=lo>.45?'建议扩量':hi<.45?'建议收缩':'区间重叠，继续探索';audit('探索评估',getTrack(a).title+' 95%区间 '+Math.round(lo*100)+'%—'+Math.round(hi*100)+'%；'+e.status);render();toast(e.status);},
template:a=>{S.template=+a;S.genStyle=templates[+a].style;render();},generate:()=>{if(!S.model){toast('模型不可用');return;}const t=S.reference?getTrack(S.reference):null;if(S.reference&&(!t||allowed(t,'adapt'))){toast('参考许可不足，播放许可不能代替改编许可');return;}const snapshot={scope:S.scope,template:templates[S.template].name,style:S.genStyle,duration:S.genDuration,price:S.genDuration/30*12,reference:S.reference,request:S.result?.scope===S.scope?S.result.id:'',outcome:S.genOutcome};confirm('确认创作 · 不发生真实扣费',kv('模板',esc(snapshot.template))+kv('参数',esc(snapshot.style)+' / '+snapshot.duration+'秒')+kv('预估积分',snapshot.price+'模拟积分，真实余额不变')+'<p>确认后创建模拟生成任务；不会复制参考曲歌词、旋律或音色身份。</p>',()=>{if(snapshot.scope!==S.scope||!S.model||(snapshot.reference&&(!getTrack(snapshot.reference)||allowed(getTrack(snapshot.reference),'adapt')))){toast('确认时资格发生变化，已阻断生成');return;}const g={...snapshot,id:'生成-'+(++S.seq),status:'生成中'};S.generation.unshift(g);audit('确认模拟生成',g.id+' · 参数与报价已锁定');render();const state=S;setTimeout(()=>{if(S!==state)return;g.status=S.model?g.outcome:'失败';if(S.page===7)render();},1400);});},
filterAssets:()=>{S.assetQuery=$('#assetQuery').value.trim();S.use=$('#use').value;S.assetOnly=$('#assetOnly').checked;render();},license:a=>{const t=getTrack(a);if(!t)return;openLayer('许可详情 · '+t.title,kv('可见范围',t.tenant?'当前租户私有':'公共作品')+kv('播放权',t.play?'允许':'拒绝')+kv('下载权',t.download?'允许':'拒绝')+kv('商业用途',esc(t.use.join('、')||'未许可'))+kv('参考改编',t.adapt?'允许摘要参考':'不允许')+kv('期限',t.expired?tag('已过期','red'):'2026-12-31（模拟）')+kv('权威来源','许可服务模拟事实，不由音乐标签推断')+'<p style="margin-top:18px">下载、播放与生成确认时再次校验。不会生成长期私有下载地址。</p>',true);},expire:a=>{const t=getTrack(a);if(!t)return;t.expired=!t.expired;S.result=null;S.playing=null;audit('许可状态演练',t.title+' → '+(t.expired?'过期':'有效'));render();},download:a=>{const t=getTrack(a);if(!t)return;const why=allowed(t,'download',{commercial:true});S.downloads.unshift({scope:S.scope,title:t.title,use:S.use,status:why?'阻断：'+why:'允许模拟下载'});audit('下载前复核',t.title+' · '+(why||'许可通过，不生成真实文件'));render();toast(why?'下载被阻断：'+why:'模拟下载复核通过，记录已生成');},adopt:a=>{const t=getTrack(a);if(!t)return;if(S.scope==='personal'){toast('企业采用需要切换至租户成员范围');return;}const why=allowed(t,'commercial',{commercial:true});if(why){toast('采用被阻断：'+why);return;}confirm('确认企业素材采用',`<p>将 ${esc(t.title)} 用于 ${esc(S.use)}。仅保存当前租户的模拟采用反馈，不写入个人听歌偏好。</p>`,()=>{const reason=allowed(t,'commercial',{commercial:true});if(reason){toast(reason);return;}if(!S.adoptions.some(x=>x.scope===S.scope&&x.title===t.title&&x.use===S.use))S.adoptions.unshift({scope:S.scope,title:t.title,use:S.use});audit('企业素材采用',t.title+' / '+S.use);render();});},
approve:()=>{const p=S.policy;if(p.status!=='待审批'||!p.validated||!p.tested){toast('先完成校验、试算并提交审批');return;}if(S.actor===p.creator){toast('创建人不可自审，请切换独立审批人');return;}p.status='已批准';p.approver=S.actor;audit('独立审批通过',p.creator+' → '+S.actor);render();},reject:()=>{if(S.policy.status!=='待审批'){toast('当前无待审批草稿');return;}if(S.actor===S.policy.creator){toast('创建人不能执行独立审批');return;}S.policy.status='已驳回';audit('驳回策略','需编辑草稿并重新校验');render();},publish:()=>{const p=S.policy;if(S.guard){toast('护栏未解除，禁止扩量');return;}if(!['已批准','灰度中'].includes(p.status)||!p.validated||!p.tested||p.approver===p.creator){toast('缺少有效的独立审批');return;}if(!S.candidate){S.previous={...S.active};S.candidate={...B2};S.publishedConfig={...p};}const steps=[1,5,20,50,100];S.gray=steps.find(x=>x>S.gray)||100;p.status=S.gray===100?'已全量':'灰度中';if(S.gray===100){S.active={...S.candidate};S.candidate=null;}audit('灰度发布',S.gray+'% · '+B2.id+' · 六项引用整组切换');S.result=null;S.playing=null;render();},rollback:()=>confirm('回滚整个策略组合？','<p>策略、模型、schema、space、encoder 与 index 将一并切回上一稳定版本，不单独切换共享索引。</p>',()=>{rollback('人工演练');render();}),guard:()=>{S.guard=true;rollback('越权护栏演练，立即止损');render();},clearGuard:()=>{S.guard=false;audit('解除护栏告警','仅解除演练状态；重新上线仍需审批链路');render();},recall:()=>{if(!profile().recall){audit('回访发送阻断','已退订，不发送');render();toast('用户已退订，发送被阻断');return;}if(profile().sent>=1){toast('达到本轮频控上限1次');return;}const r=calculate();if(!r.items.length){toast('无合法可访问作品，不发送回访');return;}profile().sent++;audit('模拟回访发送','授权、频控与当前作品资格复核通过');render();toast('已记录一条模拟回访消息，未真实发送');},return:()=>{recommend('回访落地页');render();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=actions[b.dataset.act];if(fn)fn(b.dataset.arg);});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='scope'){closeLayer();S.scope=t.value;S.result=null;S.playing=null;S.reference='';S.assetQuery='';S.requestQuery='';if(S.policy.trial){S.policy.trial=null;S.policy.tested=false;S.policy.status='草稿';}render();return;}if(t.id==='actor'){S.actor=t.value;render();return;}if(t.dataset.policy){const k=t.dataset.policy;S.policy[k]=t.type==='number'?Number(t.value):t.value;resetPolicyValidation();render();return;}if(t.id==='eventFilter'){S.eventFilter=t.value;render();}if(t.id==='genStyle'){S.genStyle=t.value;render();}if(t.id==='genDuration'){S.genDuration=+t.value;render();}if(t.id==='reference'){S.reference=t.value;render();}if(t.id==='genOutcome'){S.genOutcome=t.value;render();}});
document.addEventListener('keydown',e=>{if(!$('#layers .dialog'))return;if(e.key==='Escape'){e.preventDefault();closeLayer();return;}if(e.key==='Tab'){const list=[...document.querySelectorAll('#layers button:not(:disabled),#layers input,#layers select,#layers textarea')];if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
setInterval(()=>{if(S.playing&&!S.playing.paused&&!document.hidden)advance(1);},1000);
render();
</script></body></html>
